<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Top Cap Diamond -->
    <path d="M 250 80 L 440 180 L 250 250 L 60 180 Z" fill="url(#capGrad)" />
    
    <!-- Under Cap Body Band -->
    <path d="M 140 220 L 140 270 Q 250 320 360 270 L 360 220 Q 250 260 140 220 Z" fill="#0369a1" />

    <!-- Tassel on left -->
    <path d="M 140 190 Q 90 220 90 280" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="90" cy="285" r="12" fill="#0284c7" />
    <path d="M 82 295 L 98 295 L 94 330 L 86 330 Z" fill="#0284c7" />

    <!-- Joyous Reaching Figure (Head and Body) -->
    <!-- Head -->
    <circle cx="246" cy="195" r="26" fill="none" stroke="#ffffff" stroke-width="12" />
    <circle cx="246" cy="195" r="20" fill="#0284c7" />

    <!-- Dynamic Joyful Body with Raised Arms -->
    <path d="M 185 145 C 170 215 220 285 246 360 C 275 280 340 195 348 165 C 315 210 275 255 246 255 C 220 255 195 205 185 145 Z" fill="#ffffff" />
    <path d="M 195 155 C 185 210 225 270 246 350 C 270 275 325 200 335 175 C 305 212 270 245 246 245 C 225 245 205 205 195 155 Z" fill="url(#figureGrad)" />

    <!-- Feather Quill Pen / Pen Nib at Bottom Right -->
    <g transform="translate(260, 260)">
      <path d="M 18 45 C 35 25 65 30 75 55 C 65 85 45 110 5 135 C 25 105 32 80 18 45 Z" fill="url(#penGrad)" />
      <path d="M 5 135 L 20 120 L 30 128 Z" fill="#451a03" />
      <path d="M 12 128 L 45 80" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>

